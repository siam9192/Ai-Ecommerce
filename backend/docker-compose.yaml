services:
  app1:
    image: backend
    container_name: app1
    env_file:
      - .env
    volumes:
      - sqlite-db:/app/data

  app2:
    image: backend
    container_name: app2
    env_file:
      - .env
    volumes:
      - sqlite-db:/app/data

  app3:
    image: backend
    container_name: app3
    env_file:
      - .env
    volumes:
      - sqlite-db:/app/data

  app4:
    image: backend
    container_name: app4
    env_file:
      - .env
    volumes:
      - sqlite-db:/app/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
      - app3
      - app4

volumes:
  sqlite-db: